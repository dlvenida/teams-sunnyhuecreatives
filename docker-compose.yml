services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shc
      POSTGRES_PASSWORD: shc
      POSTGRES_DB: shc
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shc"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://shc:shc@db:5432/shc
      JWT_SECRET: dev-secret-change-in-production
      ADMIN_EMAIL: janelaurine@gmail.com
      ADMIN_PASSWORD: admin123
      CORS_ORIGINS: http://localhost:5190
      APP_URL: http://localhost:5190
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-4}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      PORT: "8090"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5190:5190"
    environment:
      VITE_API_URL: http://localhost:8090
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5190"
    depends_on:
      - api

volumes:
  pgdata:
